name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # changesets/action needs `contents: write` to push tags and the
      # release commit, `pull-requests: write` to open the release PR,
      # and `id-token: write` for the OIDC identity used by both npm
      # Trusted Publishing (replaces NPM_TOKEN) and sigstore provenance.
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI for Trusted Publisher OIDC
        # Node 22 LTS ships with npm 10.x. npm Trusted Publishing requires
        # npm 11.5.1+ for the OIDC token exchange against the npm registry.
        # Without this, changesets/action detects OIDC and tries to use it,
        # but the underlying `npm publish` (v10) falls back to anonymous
        # auth and the registry returns 404 ("auth missing", masked).
        # Pinned (not @latest) so Scorecard's Pinned-Dependencies check passes
        # and publish behaviour stays reproducible; bump deliberately.
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pipeline
        run: pnpm verify

      - name: Create release PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # v2 renamed every input this step used: version -> version-script,
          # publish -> publish-script, commit -> commit-message,
          # title -> pr-title. Unknown inputs are ignored silently, so keeping
          # the v1 names would leave the action running on its defaults.
          #
          # `pnpm run version` not `pnpm version` — the latter is pnpm's built-in
          # npm-style version-manipulation command and silently no-ops here,
          # leaving changeset files unconsumed. Same trap on `publish`.
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: release"
          pr-title: "chore: release"
          # v2 no longer reads the GITHUB_TOKEN environment variable; the token
          # goes through this input. Left explicit rather than relying on its
          # `${{ github.token }}` default.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Default. Release commit and tags are pushed through the GitHub API
          # instead of the git CLI, so they carry GitHub's GPG signature and are
          # attributed to the token owner. Set to true to go back to the CLI.
          push-with-git-cli: false
