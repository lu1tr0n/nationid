# Dependency Review Action
#
# Scans dependency manifest files that change as part of a pull request,
# surfacing known-vulnerable versions of the packages declared or updated in
# the PR. If a critical/high CVE is introduced, the action fails the check —
# preventing the PR from being merged when configured as required.
#
# Source: https://github.com/actions/dependency-review-action
# Recommended by OSSF Scorecard ("Pinned-Dependencies" + "Dependency-Update-Tool").

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
